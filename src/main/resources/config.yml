# Explicit schema for validate-only tooling. Missing values in older files inherit this default.
configVersion: 2

# Keeps the plugin loaded for diagnostics, statistics, and configuration while preventing all
# new runs and queue reservations outside an event. Change to true, then /walk admin reload.
event:
  enabled: false

# Each entry is an independent arena. The start is the center of the generated course.
startPositions:
  - id: main
    x: 1500
    y: 150
    z: 0
    pitch: 0
    yaw: 0
    world: world
    useCustomEndPosition: false
    endPos:
      x: 1450
      y: 150
      z: 50
      pitch: 0
      yaw: 0
      world: world

# Used when theme.active is custom. A preset resolves its own platform palette instead.
parkourBlocks:
  - EMERALD_BLOCK

gameplay:
  # Falling this many blocks below the arena center ends the run.
  fallDistance: 6.0
  # Generated jumps remain within this horizontal radius of the center.
  horizontalRadius: 6
  # Hard cap and no-progress timeout prevent abandoned runs from exhausting arenas.
  maximumRunSeconds: 1800
  idleTimeoutSeconds: 300
  # Random course blocks will not overwrite existing world blocks.
  # The configured starting block is always snapshotted and restored.
  onlyReplaceAir: true

# When all arenas are occupied, players can explicitly join a FIFO queue and must accept
# an expiring readiness prompt before a run starts. No arena is reserved for an offline player.
queue:
  enabled: true
  joinCooldownSeconds: 5
  readinessWindowSeconds: 20
  reminderIntervalSeconds: 5

# RANDOM preserves legacy behavior. Other options: ROUND_ROBIN, LEAST_RECENTLY_USED, PINNED.
arenaSelection:
  policy: RANDOM
  # Required only for PINNED; if that arena is busy, selection safely falls back to LRU.
  pinnedArena: ''

particle:
  show: true
  type: TOTEM_OF_UNDYING
  count: 12

# Used only by the backward-compatible custom theme. Every cue can use Paper directly
# (provider: default) or CMI's sound command (provider: cmi). Volume is a 0.0-1.0 fraction;
# 0.8 means 80%. Vanilla pitch is 1.0. Set enabled to false to silence one cue.
sounds:
  start:
    enabled: true
    provider: default
    sound: minecraft:block.note_block.pling
    volume: 0.8
    pitch: 1.0
  landing:
    enabled: true
    provider: default
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.8
    pitch: 1.0
  milestone:
    enabled: true
    provider: default
    sound: minecraft:entity.player.levelup
    volume: 0.8
    pitch: 1.0
  combo:
    enabled: true
    provider: default
    sound: minecraft:block.note_block.chime
    volume: 0.8
    pitch: 1.0
  finish:
    enabled: true
    provider: default
    sound: minecraft:ui.toast.challenge_complete
    volume: 0.8
    pitch: 1.0
  failure:
    enabled: true
    provider: default
    sound: minecraft:entity.item.break
    volume: 0.8
    pitch: 1.0

# Set this to custom or one of the exact eight bundled event presets and run
# /walk admin reload. Custom preserves the top-level parkourBlocks, particle, and sound values.
theme:
  active: custom

# Presets are validated with the same safe-block and untyped-particle policies as custom values.
# You may add up to 32 lowercase presets using the same structure.
