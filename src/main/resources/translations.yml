helpCommand:
  - '&7--------------- &6&lWalkThePlank &7---------------'
  - ' &6/walk &7- &fOpen the menu'
  - ' &6/walk play &7- &fStart a run'
  - ' &6/walk leave &7- &fEnd your run'
  - ' &6/walk stats &7- &fShow your personal best and rank'
  - ' &6/walk top &7- &fShow the top ten'
  - ' &6/walk info &7- &fShow release and platform details'
  - ' &6/walk admin &7- &fShow staff commands when permitted'
  - ' &6/walk debug &7- &fShow safe diagnostics when permitted'
  - '&7------------------------------------------------'

mainGui:
  title: '1MB Walk the Plank'
  titleColor: '#111827'
  useFillItem: true
  fillItem: LIGHT_BLUE_STAINED_GLASS_PANE
  tutorialItem:
    item: BOOK
    title: 'minimessage:<!italic><color:#bde0fe><bold>How to Play</bold></color>'
    glow: false
    lore:
      - 'minimessage:<!italic><color:#f2f5f7>Land on the nearest {{platformBlock}}.</color>'
      - 'minimessage:<!italic><color:#f2f5f7>Each successful landing earns one point.</color>'
      - 'minimessage:<!italic><color:#d8e2dc>A new platform appears after every jump.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffc8dd>Fair play:</color> <color:#d8e2dc>no elytra, pearls,</color>'
      - 'minimessage:<!italic><color:#d8e2dc>movement potions, or outside help.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click the diamond boots to begin.</color>'
  playItem:
    item: DIAMOND_BOOTS
    title: 'minimessage:<!italic><color:#bde0fe><bold>Play</bold></color>'
    glow: true
    lore:
      - 'minimessage:<!italic><color:#f2f5f7>Start an endless parkour run.</color>'
      - 'minimessage:<!italic><color:#d8e2dc>If all arenas are busy, you will join</color>'
      - 'minimessage:<!italic><color:#d8e2dc>the queue automatically.</color>'
      - 'minimessage:<!italic><color:#b7f7c4>Click again when your turn is ready.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffc8dd>Leave safely at any time:</color> <color:#ffd166>/walk leave</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to begin.</color>'
  scoreboardItem:
    item: OAK_SIGN
    title: 'minimessage:<!italic><color:#bde0fe><bold>Top 10</bold></color>'
    glow: false
    scoreboardRecord: 'minimessage:<!italic><color:#d8e2dc>{{rank}}.</color> <color:#bde0fe>{{playerName}}</color> <color:#d8e2dc>•</color> <color:#ffd166>{{score}} points</color>'
    noPermissionLore:
      - 'minimessage:<!italic><color:#ffb3c1>Requires:</color> <color:#d8e2dc>{{permissionName}}</color>'
    lore:
      - '{{scoreboard}}'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to view your position.</color>'
  playerItem:
    item: PLAYER_HEAD
    title: 'minimessage:<!italic><color:#bde0fe><bold>{{playerName}}''s Stats</bold></color>'
    glow: false
    noPermissionLore:
      - 'minimessage:<!italic><color:#ffb3c1>Requires:</color> <color:#d8e2dc>{{permissionName}}</color>'
    noScoreLore:
      - 'minimessage:<!italic><color:#d8e2dc>No completed score yet.</color>'
      - 'minimessage:<!italic><color:#f2f5f7>Start a run to join the leaderboard.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to view /walk stats.</color>'
    lore:
      - 'minimessage:<!italic><color:#d8e2dc>Personal best:</color> <color:#ffd166>{{playerScore}} points</color>'
      - 'minimessage:<!italic><color:#d8e2dc>Classic rank:</color> <color:#bde0fe>#{{playerPlace}} of {{totalPlaces}}</color>'
      - 'minimessage:<!italic><color:#d8e2dc>Leaderboard:</color> <color:#b7f7c4>Top {{percentile}}%</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to view /walk stats.</color>'
  backItem:
    item: ARROW
    title: 'minimessage:<!italic><color:#bde0fe><bold>Back to Main Menu</bold></color>'
    glow: false
    lore:
      - 'minimessage:<!italic><color:#d8e2dc>Return to the server menu.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to run /menu.</color>'
  closeItem:
    item: BARRIER
    title: 'minimessage:<!italic><color:#ffb3c1><bold>Close</bold></color>'
    glow: false
    lore:
      - 'minimessage:<!italic><color:#d8e2dc>Close this menu.</color>'
      - ''
      - 'minimessage:<!italic><color:#ffd166>Click to close.</color>'
