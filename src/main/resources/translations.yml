helpCommand:
  - '&7--------------- &6&lWalkThePlank &7---------------'
  - ' &6/walk &7- &fOpen the menu'
  - ' &6/walk play &7- &fStart a run'
  - ' &6/walk leave &7- &fEnd your run'
  - ' &6/walk stats &7- &fShow your personal best and rank'
  - ' &6/walk top &7- &fShow the top ten'
  - ' &6/walk info &7- &fShow release and platform details'
  - ' &6/walk admin &7- &fShow staff commands when permitted'
  - ' &6/walk debug &7- &fShow safe diagnostics when permitted'
  - '&7------------------------------------------------'

mainGui:
  title: 'minimessage:<dark_blue><bold>WalkThePlank</bold>'
  useFillItem: true
  fillItem: WHITE_STAINED_GLASS_PANE
  tutorialItem:
    item: BOOK
    title: 'minimessage:<dark_blue><bold>How to play</bold>'
    glow: false
    lore:
      - '&7Jump to the next generated block.'
      - '&7Each landing adds one point.'
      - '&7Do not use flight or movement effects.'
      - ''
      - '&fClick the diamond boots to start.'
  playItem:
    item: DIAMOND_BOOTS
    title: 'minimessage:<dark_blue><bold>Play</bold>'
    glow: true
    lore:
      - '&7Start a new endless parkour run.'
      - '&7If arenas are busy, click to join the fair queue.'
      - '&7Click again when your readiness prompt appears.'
      - '&7Use &c/walk leave &7to finish safely.'
  scoreboardItem:
    item: OAK_SIGN
    title: 'minimessage:<dark_blue><bold>Top 10</bold>'
    glow: false
    scoreboardRecord: '&f{{rank}}. &9{{playerName}} &7({{score}})'
    noPermissionLore:
      - '&cRequires {{permissionName}}'
    lore:
      - '{{scoreboard}}'
      - ''
      - '&fClick to see your position.'
